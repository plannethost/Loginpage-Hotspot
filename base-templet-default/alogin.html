<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="2; url=$(link-redirect)">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="theme-color" content="#04070f">
    <title>Network Access — Authenticated</title>

    <link rel="icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">

    <script>
        function startClock() {
            $(if popup == 'true')
            open('$(link-status)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=290,height=200');
            $(endif)
            location.href = unescape('$(link-redirect-esc)');
        }
    </script>
</head>

<body onLoad="startClock()">
    <div class="bg-glow"></div>
    <div class="bg-grid"></div>
    <div class="bg-scan"></div>

    <main class="shell shell--center">
        <section class="card card--center">
            <div class="splash">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3 4 6v6c0 4.4 3.1 8.3 8 9 4.9-.7 8-4.6 8-9V6l-8-3Z" />
                    <path d="m9 12 2 2 4-4" />
                </svg>
            </div>

            <span class="badge">
                <span class="dot"></span>
                Authenticated
            </span>

            <h1 class="card__title">You are logged in</h1>
            <p class="card__sub">Opening your destination page now. Keep this tab open if the redirect is blocked.</p>

            <div class="progress" role="progressbar" aria-label="Redirecting"></div>

            <p class="hint">
                If nothing happens, <a href="$(link-redirect)">continue manually</a>.
            </p>

            <p class="card__foot">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="7" rx="2" />
                    <rect x="3" y="13" width="18" height="7" rx="2" />
                </svg>
                Powered by MikroTik RouterOS
            </p>
        </section>
    </main>

    <script src="js/ui.js"></script>
</body>

</html>
