$(if http-status == 302)Hotspot redirect$(endif)
$(if http-header == "Location")$(link-redirect)$(endif)
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=$(link-redirect)">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="theme-color" content="#04070f">
    <title>Redirecting…</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="bg-glow"></div>
    <div class="bg-grid"></div>

    <main class="shell shell--center">
        <section class="card card--center">
            <div class="splash">
                <div class="spinner"></div>
            </div>
            <span class="badge">
                <span class="dot"></span>
                Redirecting
            </span>
            <h1 class="card__title">Taking you to your page</h1>
            <p class="card__sub">If you are not redirected automatically, continue manually.</p>
            <div class="actions">
                <a class="btn" href="$(link-redirect)">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14" />
                        <path d="m13 6 6 6-6 6" />
                    </svg>
                    Continue
                </a>
            </div>
        </section>
    </main>
</body>

</html>
